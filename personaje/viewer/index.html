<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15211d">
  <title>Personaje 3D · Prueba de animación</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script>
</head>
<body>
  <main id="view" aria-label="Personaje 3D jugando dominó">
    <header class="panel"><strong>PERSONAJE 3D</strong><span>Sentarse · Agarrar · Colocar</span></header>
    <div id="loading" role="status"><span class="spinner"></span><strong>Cargando la animación…</strong><small id="load-detail">Preparando el personaje y la mesa</small></div>
    <div id="error" role="alert" hidden></div>
    <section id="controls" class="panel" aria-label="Controles de la animación">
      <div class="button-row"><button id="play" type="button" disabled>Reproducir</button><button id="restart" type="button" disabled>Desde el inicio</button><output id="time" for="timeline">0,0 / 0,0 s</output></div>
      <label for="timeline">Revisar movimiento</label>
      <input id="timeline" type="range" min="0" max="8" value="0" step="0.01" disabled aria-label="Segundo de la animación">
      <p>Arrastra para girar la vista · Pellizca o usa la rueda para acercarte</p>
    </section>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
